name: health_push_app
description: Health Tracker + Push-up Enforced App Lock System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  # 3.32+ required: CardThemeData, WidgetStateProperty,
  # ColorScheme.surfaceContainerHighest are all used in utils/app_theme.dart
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_remote_config: ^4.3.0
  cloud_functions: ^4.6.0

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  table_calendar: ^3.0.9
  percent_indicator: ^4.2.3

  # Camera & ML
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.11.0
  image_picker: ^1.0.7
  mobile_scanner: ^4.0.1

  # Storage & Local
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking & API
  http: ^1.2.0
  dio: ^5.4.0

  # Payments: manual UPI settlement (static QR + UTR + screenshot proof),
  # reviewed by an admin. No payment gateway SDK required.
  qr_flutter: ^4.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  permission_handler: ^11.2.0
  sensors_plus: ^4.0.2
  package_info_plus: ^5.0.1
  installed_apps: ^1.5.0
  url_launcher: ^6.2.3

  # Notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
