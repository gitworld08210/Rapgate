name: health_push_app
description: RepGate — Health Tracker + Push-up Enforced App Lock
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  # 3.32+ required: CardThemeData, WidgetStateProperty,
  # ColorScheme.surfaceContainerHighest are all used in utils/app_theme.dart
  flutter: '>=3.32.0'

# Every dependency below is verified in use. Packages are deliberately NOT
# added "just in case" — each one adds APK weight, and Flutter plugins add
# native init cost at startup even when never called.
dependencies:
  flutter:
    sdk: flutter

  # ---------------- Supabase ----------------
  supabase_flutter: ^2.8.0
  http: ^1.6.0

  # ---------------- State ----------------
  provider: ^6.1.1

  # ---------------- Camera & on-device ML ----------------
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.11.0
  image_picker: ^1.0.7
  mobile_scanner: ^4.0.1
  sensors_plus: ^4.0.2

  # ---------------- UPI fine settlement ----------------
  # Renders the payment QR locally; no gateway SDK needed.
  qr_flutter: ^4.1.0

  # ---------------- Notifications ----------------
  # Remote delivery is handled by Supabase notification events; local
  # notifications remain available for in-app reminders.
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1

  # ---------------- Utils ----------------
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# ---------------------------------------------------------------------------
# Removed as unused (verified with grep across lib/ — zero references each).
# Re-add deliberately if a feature actually needs one.
#
#   fl_chart              charts are hand-written in widgets/stat_chart.dart
#   google_fonts          fetched fonts over HTTP on every cold start
#   hive, hive_flutter    initialised but never used to store anything
#   hive_generator        codegen for the above
#   build_runner          only needed by hive_generator
#   flutter_riverpod      provider is used instead
#   dio, http             all outbound HTTP happens in Cloud Functions
#   shared_preferences    native SharedPreferences is used from Kotlin instead
#   installed_apps        replaced by the platform channel getInstalledApps
#   firebase_remote_config  anti-cheat thresholds live in functions/src/config.ts
#   permission_handler    camera/gallery plugins request their own; the special
#                         Android permissions are handled by MainActivity intents
#   path_provider         no local file paths needed
#   uuid                  Firestore generates document IDs
#   url_launcher          no outbound links
#   package_info_plus     version not surfaced in the UI
#   shimmer               no shimmer placeholders
#   flutter_animate       implicit animations used directly
#   table_calendar        reports use a hand-written heatmap
#   percent_indicator     progress bars are hand-written
#   cached_network_image  plain Image.network with loadingBuilder is enough
#   collection            added for firstOrNull, which was later replaced by an
#                         explicit isEmpty/first guard in food_scanner_screen
# ---------------------------------------------------------------------------

flutter:
  uses-material-design: true
  assets:
    - assets/images/
