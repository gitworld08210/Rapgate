workflows:
  android-release:
    name: Rapgate Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        SUPABASE_URL: "https://hjxesslwvimpgxazwmep.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeGVzc2x3dmltcGd4YXp3bWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODYwMzEsImV4cCI6MjEwNDk2MjAzMX0.GSFz2MgENHI8X1iD-el-sN-E3JgCDCeVLt0Z_EWW_gg"
        CLOUDINARY_CLOUD_NAME: "dxoqepdck"
        CLOUDINARY_UPLOAD_PRESET: "rapgate-dataset"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_BIN=$(which flutter)
          FLUTTER_DIR=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "flutter.sdk=$FLUTTER_DIR" > "$CM_BUILD_DIR/android/local.properties"
      - name: Set permissions for gradlew
        script: |
          chmod +x android/gradlew
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=$CLOUDINARY_UPLOAD_PRESET
    artifacts:
      - build/**/outputs/**/*.apk
