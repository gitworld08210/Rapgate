name: Build APK

on:
  push:
    branches: [main, feat/supabase-migration]
  workflow_dispatch:

# Required by the release action to create a tag and attach the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # --split-per-abi produces one APK per architecture instead of a single
      # fat APK carrying arm64 + armv7 + x86_64 native libs.
      # Icon tree-shaking is left ON (the previous --no-tree-shake-icons flag
      # was bundling the entire Material icon font).
      - name: Build APK (release)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=https://gnwyshshpirgypensncm.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdud3lzaHNocGlyZ3lwZW5zbmNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzEwMDYsImV4cCI6MjEwMjgwNzAwNn0.aMjdI1tWjRqDrgkidBAxgiTIT8qFL6ZOTFZiYCFAFFE \
            --dart-define=CLOUDINARY_CLOUD_NAME=dxoqepdck \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=rapgate-dataset

      - name: Report APK sizes
        run: |
          echo "### APK sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk \
            | awk '{printf "%-45s %s\n", $9, $5}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HealthPush-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "HealthPush v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## HealthPush — Health Tracker + Push-up App Lock

            ### Which file do I download?

            | File | Use this if |
            |---|---|
            | `app-arm64-v8a-release.apk` | **Most phones** — anything from ~2017 onward |
            | `app-armeabi-v7a-release.apk` | Older / budget 32-bit devices |
            | `app-x86_64-release.apk` | Emulators only |

            If unsure, take **arm64-v8a**.

            **First install:** Android will warn about an unknown developer.
            Choose "Install anyway" / enable install from unknown sources.
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
