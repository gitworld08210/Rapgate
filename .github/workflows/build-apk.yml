name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold
        run: |
          flutter create . --org com.healthpush --project-name health_push_app --platforms android

      - name: Enable core library desugaring
        run: |
          # flutter_local_notifications requires Java 8+ APIs via desugaring
          cd android/app
          # Add coreLibraryDesugaring + compileOptions to build.gradle
          sed -i '/android {/a\    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' build.gradle
          sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' build.gradle
          # Bump minSdk to 21 (required by many plugins)
          sed -i 's/minSdk .*/minSdk = 23/' build.gradle
          cd ../..
          # Set Kotlin JVM target
          cat >> android/app/build.gradle << 'EOF'

          kotlinOptions {
              jvmTarget = "17"
          }
          EOF

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "611057820540",
              "project_id": "social-claud",
              "storage_bucket": "social-claud.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:611057820540:android:7d0462c6bd7628a679baf9",
                  "android_client_info": {
                    "package_name": "com.healthpush.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCDFm516Yy7E82He3xaZp5jYtIUJLkiPtI"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthPush-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "HealthPush v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## HealthPush - Health Tracker + Push-up App Lock
            
            Download `app-release.apk` below and install on your Android phone.
            
            **First install:** Enable "Install from unknown sources" when prompted.
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
